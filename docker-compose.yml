services:
  # Serviço do banco de dados MySQL
  db:
    image: mysql:8.4
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: meubanco
      MYSQL_USER: user
      MYSQL_PASSWORD: 123456
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uuser", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Serviço do PHP com Apache
  web:
    build: .
    container_name: php_web
    restart: always
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: meubanco
      DB_USERNAME: user
      DB_PASSWORD: 123456
    depends_on:
      db:
        condition: service_healthy

# Define um volume nomeado para persistir os dados do MySQL
volumes:
  db_data:
